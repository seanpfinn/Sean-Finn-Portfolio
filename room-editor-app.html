<style>
/* Layout: full-bleed 3D dollhouse stage with a paint-store "fan deck" panel (right on desktop, bottom sheet on phones) */
:root{
  --stage:#e9e4dc; --paper:#fbfaf7; --ink:#24211d; --muted:#77706a; --line:#e2ddd5;
  --accent:#2f5d5e; --accent-ink:#ffffff; --scrim:rgba(251,250,247,.86);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#1c1b1a; --paper:#262422; --ink:#f1ece4; --muted:#a69e94; --line:#3a3633;
  --accent:#7fb7b3; --accent-ink:#10201f; --scrim:rgba(38,36,34,.86); color-scheme:dark }}
:root[data-theme="dark"]{
  --stage:#1c1b1a; --paper:#262422; --ink:#f1ece4; --muted:#a69e94; --line:#3a3633;
  --accent:#7fb7b3; --accent-ink:#10201f; --scrim:rgba(38,36,34,.86); color-scheme:dark }

html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.hud{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:16px;pointer-events:none;display:grid;gap:4px}
.hud h1{font-family:var(--display);font-weight:800;font-size:clamp(20px,2.4vw,30px);letter-spacing:-.02em;margin:0;line-height:1}
.hud p{margin:0;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
.tools{position:absolute;right:16px;top:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.views{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:14px;right:16px;display:flex;gap:6px;flex-wrap:wrap}
.tb{font:500 12px var(--body);border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 11px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tb:hover{border-color:var(--ink)}
.tb[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tb svg{width:14px;height:14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font:500 11px var(--mono);padding:4px 7px;border-radius:4px;transform:translate(10px,-130%);white-space:nowrap}
/* compare */
#split{position:absolute;top:0;bottom:0;width:0;pointer-events:none}
#split .bar{position:absolute;top:0;bottom:0;left:-1px;width:2px;background:var(--paper);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
#split .knob{position:absolute;top:50%;left:-20px;width:40px;height:40px;margin-top:-20px;border-radius:50%;background:var(--paper);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:auto;cursor:ew-resize;display:grid;place-items:center;touch-action:none;color:var(--ink)}
.cmp-label{position:absolute;top:64px;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;background:var(--scrim);color:var(--ink);padding:4px 8px;border-radius:4px;pointer-events:none}

aside{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2;padding-left:12px;padding-right:12px}
.tabs button{flex:1;font:600 13px var(--body);background:none;border:0;color:var(--muted);padding:14px 6px 12px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.sec{padding-block:16px;padding-left:20px;padding-right:20px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.eyebrow{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.note{font:400 11.5px var(--body);color:var(--muted);line-height:1.4;margin:0}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:7px;font:500 12.5px var(--body);border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 10px 6px 7px;border-radius:999px;cursor:pointer;white-space:nowrap}
.pill i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none;background-size:cover}
.pill[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sel-head{display:flex;gap:14px;align-items:center}
.sel-head .big{width:54px;height:54px;border-radius:10px;border:1px solid rgba(0,0,0,.12);flex:none;background-size:cover}
.sel-head h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:0;line-height:1.05;text-wrap:balance}
.sel-head .meta{font:400 11.5px var(--mono);color:var(--muted);margin-top:4px}
.linkish{background:none;border:0;padding:0;color:var(--accent);font:500 12px var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:3px;justify-self:start}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1 1 auto;font:500 12px var(--body);background:transparent;color:var(--ink);border:0;border-right:1px solid var(--line);padding:7px 8px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.decktabs{display:flex;gap:4px;flex-wrap:wrap}
.decktabs button{font:500 11.5px var(--body);border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;padding:5px 8px;cursor:pointer}
.decktabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.search{width:100%;font:400 13px var(--body);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--stage);color:var(--ink)}
.deck{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip{display:grid;grid-template-rows:56px auto;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper);cursor:pointer;text-align:left;padding:0;color:var(--ink);font:inherit}
.chip .sw{display:block;background-size:cover;background-position:center}
.chip .lab{padding:6px 7px 7px;display:grid;gap:1px;min-width:0}
.chip b{font:600 11.5px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{font:400 9.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.chip:hover{border-color:var(--muted)}
.empty{font:400 12px var(--body);color:var(--muted)}
.custom{display:flex;align-items:center;gap:10px}
.custom input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--paper);cursor:pointer}
.custom label{font:500 12.5px var(--body)}
.btn{font:600 12.5px var(--body);border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > input[type=text]{flex:1 1 140px;min-width:0}
.toast{font:400 11.5px var(--mono);color:var(--accent);min-height:1em}
.copybox{width:100%;font:400 11px var(--mono);min-height:120px;border:1px solid var(--line);border-radius:6px;background:var(--stage);color:var(--ink);padding:8px}
/* schemes */
.cards{display:grid;gap:10px}
.card{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;border:1px solid var(--line);border-radius:10px;padding:8px;align-items:center}
.card.mine{border-color:var(--muted)}
.card img,.card .ph{width:112px;height:72px;border-radius:6px;object-fit:cover;background:var(--stage);display:block}
.card h3{font:700 14px var(--display);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font:400 11px var(--mono);color:var(--muted);margin-top:2px}
.card .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.card .acts .btn{padding:5px 9px;font-size:11.5px}
.vote[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.faces{display:flex;margin-left:2px}
.faces img{width:20px;height:20px;border-radius:50%;border:2px solid var(--paper);margin-left:-6px}
.lead{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
/* room tab */
.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dim{display:grid;gap:4px}
.dim label{font:500 11px var(--mono);color:var(--muted)}
.stepper{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{width:30px;border:0;background:var(--stage);color:var(--ink);font:600 15px var(--body);cursor:pointer}
.stepper output{flex:1;text-align:center;font:500 13px var(--mono);padding:7px 0;font-variant-numeric:tabular-nums}
table.est{width:100%;border-collapse:collapse;font-size:12.5px}
.est th{font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.est td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
.est td:nth-child(n+2),.est th:nth-child(n+2){text-align:right;white-space:nowrap}
.est .dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15);background-size:cover}
.est small{display:block;color:var(--muted);font:400 10.5px var(--mono);margin-top:2px}
.estwrap{overflow-x:auto}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  aside{border-left:0;border-top:1px solid var(--line);max-height:50vh}
  .sec{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
  .picker{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
  .deck{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:92px;overflow-x:auto;padding-bottom:4px}
  .views{bottom:10px}
  .tools{max-width:100%;left:16px;top:60px;justify-content:flex-start}
  .sel-head h2{font-size:20px}
  .cmp-label{top:104px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</div>

/* ================= Apply colors & lighting ================= */
function metalOf(s){ if(s.finish==='none') return null; const base=METAL[s.finish]||METAL.nickel; return {...base,hex:s.custom&&s.hex?s.hex:base.hex}; }
function paint(mat,s){mat.color.set(s.hex); mat.roughness=SHEENS[s.sheen||'eggshell'][1];}
function applyState(b,st){
  const M=b.M;
  for(const w in WALLS){const s=st.walls[w], m=M.wall[w];
    if(s.paper){ const t=paperTex(s.paper,s.hex); if(m.map!==t){m.map=t; m.needsUpdate=true;} m.color.set(0xffffff); m.roughness=s.paper.id==='grasscloth'?.95:.8; }
    else { if(m.map){m.map=null; m.needsUpdate=true;} paint(m,s); } }
  for(const id of ['wainscot','trim','ceiling','door','cabinet']) paint(M[id],st.items[id]);
  M.bead.color.set(st.items.wainscot.hex); M.bead.roughness=M.wainscot.roughness;
  M.floor.color.set(st.items.floor.hex); M.sink.color.set(st.items.sink.hex); M.toilet.color.set(st.items.toilet.hex);
  M.towel.color.set(st.items.towel.hex); M.frames.color.set(st.items.frames.hex);
  const fr=st.items.frames.hex.toLowerCase(); M.frames.metalness=['#b8955a','#b9bbbe'].includes(fr)?.8:0; M.frames.roughness=M.frames.metalness?.35:.55;
  for(const id of METAL_IDS){const p=metalOf(st.items[id]); if(id==='mirror'){b.mirrorFrame.visible=!!p; if(!p) continue;} M[id].color.set(p.hex); M[id].metalness=p.metal; M[id].roughness=p.rough;}
  const lw=st.styles.lower;
  b.lowerMeshes.forEach(m=>m.material= lw==='none'?M.wall[m.userData.lower]:(lw==='beadboard'?M.bead:M.wainscot));
}
function applyMood(b){
  const m=MOODS[ui.mood]; const share=b.lights.length? m.bulbI/(b.lights.length===2?2:1):0;
  b.lights.forEach(L=>{L.color.set(m.bulb); L.intensity=b.lights.length===2?m.bulbI*.5:m.bulbI; L.visible=m.bulbI>0;});
  b.glow.forEach(g=>{g.emissiveIntensity=m.glow*.9; g.emissive.set(m.bulb===0xffffff?0xffffff:m.bulb)});
  b.M.bulb.color.set(m.glow>.5?0xfff3d6:0xf2efe8);
}
function applySceneMood(){const m=MOODS[ui.mood]; hemi.color.set(m.hemi[0]); hemi.groundColor.set(m.hemi[1]); hemi.intensity=m.hemi[2];
  sun.color.set(m.sun[0]); sun.intensity=m.sun[1]; fill.color.set(m.fill[0]); fill.intensity=m.fill[1]; renderer.toneMappingExposure=m.exp;
  [cur,orig].forEach(b=>b&&applyMood(b));}

/* ================= Builds ================= */
let cur=null, orig=null, measureGroup=null;
function rebuild(which='both'){
  if(which!=='orig'){disposeBuild(cur); cur=buildRoom(state); scene.add(cur.root);}
  if(which!=='cur'){disposeBuild(orig); const o=clone(FILMED); o.dims=clone(state.dims); orig=buildRoom(o); orig.root.visible=false; scene.add(orig.root);}
  fill.position.set(cur.W/2-1.6,cur.H-1.4,cur.D/2-1.6);
  buildMeasure(); updateDimLine();
}
const ftin=ft=>{const i=Math.round(ft*12); return `${Math.floor(i/12)}′${i%12}″`};
const inStr=i=>`${Math.floor(i/12)}′${i%12}″`;
function updateDimLine(){const d=state.dims; document.getElementById('dimline').textContent=`${inStr(d.w)} × ${inStr(d.d)} · ${inStr(d.h)} ceiling`}

/* ================= Measurement overlay ================= */
function labelSprite(text){const [c,g]=cv(256,72); g.font='600 34px "IBM Plex Mono", monospace'; const w=Math.min(250,g.measureText(text).width+28);
  g.fillStyle='rgba(36,33,29,.92)'; g.beginPath(); g.roundRect((256-w)/2,10,w,52,12); g.fill(); g.fillStyle='#fbfaf7'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,128,37);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true})); s.scale.set(1.6,.45,1); s.renderOrder=999; return s}
function dimLine(a,b,tickDir,text){const g=new THREE.Group(); const mat=new THREE.LineBasicMaterial({color:0x2f5d5e,depthTest:false});
  const pts=[a,b,a.clone().add(tickDir),a.clone().sub(tickDir),b.clone().add(tickDir),b.clone().sub(tickDir)];
  const geo=new THREE.BufferGeometry().setFromPoints([pts[0],pts[1],pts[2],pts[3],pts[4],pts[5]]); const l=new THREE.LineSegments(geo,mat); l.renderOrder=998; g.add(l);
  const s=labelSprite(text); s.position.copy(a).add(b).multiplyScalar(.5); g.add(s); return g}
function buildMeasure(){
  if(measureGroup){scene.remove(measureGroup); measureGroup.traverse(o=>{o.geometry&&o.geometry.dispose(); o.material&&(o.material.map&&o.material.map.dispose(),o.material.dispose())});}
  const {W,D,H}=cur, g=new THREE.Group(), o=.45, V=THREE.Vector3;
  g.add(dimLine(new V(-W/2,.02,D/2+o),new V(W/2,.02,D/2+o),new V(0,0,.15),ftin(W)+' wide'));
  g.add(dimLine(new V(W/2+o,.02,-D/2),new V(W/2+o,.02,D/2),new V(.15,0,0),ftin(D)+' deep'));
  g.add(dimLine(new V(-W/2-o,0,D/2+o),new V(-W/2-o,H,D/2+o),new V(.15,0,0),ftin(H)+' high'));
  g.add(dimLine(new V(-W/2+.02,2.95,-D/2+1.7),new V(-W/2+.02,2.95,-D/2+1.7).setX(cur.sinkX-1),new V(0,0,.12),ftin(cur.sinkX-1+W/2)+' to sink'));
  g.traverse(o=>o.layers.set(1)); g.visible=ui.measure; measureGroup=g; scene.add(g);
}

  E.append(el('div',{class:'row'},el('button',{class:'btn primary',onclick:()=>copyList(rows,lf)},'Copy shopping list'),
    el('button',{class:'btn',onclick:e=>{const t=document.getElementById('toast'); if(t.dataset.arm){state=defaults(); rebuild(); save(); renderTab(); } else {t.dataset.arm='1'; t.textContent='Tap Reset room again to restore the original room.'; setTimeout(()=>{delete t.dataset.arm; t.textContent=''},3000)}}},'Reset room')),toast);
  body.append(E);
}
function copyList(rows,lf){
  const lines=['POWDER ROOM PLAN',`${inStr(state.dims.w)} × ${inStr(state.dims.d)}, ${inStr(state.dims.h)} ceiling`,'','PAINT & PAPER'];
  for(const r of rows){const buy=r.kind==='paper'?Math.max(1,Math.ceil(r.sqft/ROLL))+' double rolls':buyPaint(r.sqft)[0]; lines.push(`- ${r.label}: ${buy} (${Math.round(r.sqft)} sq ft) — ${[...r.what].join(', ')}`)}
  lines.push('','SHEENS'); for(const w in WALLS){const s=state.walls[w]; if(!s.paper) lines.push(`- ${WALLS[w]}: ${SHEENS[s.sheen||'eggshell'][0]}`)}
  for(const id of ['trim','ceiling','door']) lines.push(`- ${BYID[id].name}: ${SHEENS[state.items[id].sheen||'eggshell'][0]}`);
  lines.push('','FIXTURES',`- Sink: ${STYLES.sink[state.styles.sink]}, ${state.items.sink.name}`,`- Toilet: ${state.items.toilet.name}`,`- Mirror: ${STYLES.mirror[state.styles.mirror]}, ${label('mirror',state.items.mirror)}`,`- Vanity light: ${STYLES.light[state.styles.light]}, ${label('light',state.items.light)}`);
  for(const id of ['faucet','towelring','tp','knob','plates']) lines.push(`- ${BYID[id].name}: ${label(id,state.items[id])}`);
  lines.push(`- Floor tile: ${state.items.floor.name}`);
  lines.push('','TRIM',`- Baseboard ${Math.round(lf.baseboard)} ft, crown ${Math.round(lf.crown)} ft, casing ${Math.round(lf.casing)} ft`+(lf.rail?`, chair rail ${Math.round(lf.rail)} ft`:'')+(lf.molding?`, panel molding ${Math.round(lf.molding)} ft`:''));
  const text=lines.join('\n'), t=document.getElementById('toast');
  const fallback=()=>{const ta=el('textarea',{class:'copybox',readonly:'','aria-label':'Shopping list'}); ta.value=text; t.replaceWith(ta); ta.select()};
  try{navigator.clipboard.writeText(text).then(()=>{t.textContent='Shopping list copied.'},fallback)}catch(e){fallback()}
}

/* ---------- Schemes tab (shared board + votes) ---------- */
let db=null, user=null, uid=null, canWrite=null, isOwner=false, schemes=[], votes={}, profiles={}, dbReady=false, writeBlocked=false;
const LOCAL_SCHEMES='powder-room-lab-schemes';
function localSchemes(){try{return JSON.parse(localStorage.getItem(LOCAL_SCHEMES)||'[]')}catch(e){return []}}
function setLocalSchemes(a){try{localStorage.setItem(LOCAL_SCHEMES,JSON.stringify(a))}catch(e){}}
function thumbnail(){
  const was=ui.compare; ui.compare=false; drawFrame(); ui.compare=was;
  const src=renderer.domElement, [c,g]=cv(320,200); const ar=src.width/src.height, tar=320/200;
  let sw=src.width, sh=src.height, sx=0, sy=0; if(ar>tar){sw=sh*tar; sx=(src.width-sw)/2} else {sh=sw/tar; sy=(src.height-sh)/2}
  g.drawImage(src,sx,sy,sw,sh,0,0,320,200); return c.toDataURL('image/jpeg',.72);
}
function snapshotState(){const s=clone(state); delete s.scope; return s}
async function saveScheme(name){
  const doc={name:name.slice(0,60),state:snapshotState(),thumb:thumbnail(),createdAt:Date.now(),createdBy:uid||null};
  const t=document.getElementById('scheme-toast');
  if(db&&!writeBlocked){ try{await db.collection('schemes').add(doc); t.textContent='Saved to the shared board.'; return}catch(e){ if(e&&e.code==='invalid_argument'){writeBlocked=true} else if(e&&e.code==='quota_exceeded'){t.textContent='The board is full. Delete an old scheme and try again.'; return} } }
  const a=localSchemes(); a.unshift({...doc,id:'local-'+Date.now()}); setLocalSchemes(a.slice(0,20)); t.textContent='Saved on this device.'; renderTab();
}
function loadScheme(sc){state=merge(defaults(),sc.state); rebuild(); save(); ui.tab='edit'; renderTabs(); renderTab(); }
async function delScheme(sc){
  if(sc.id.startsWith('local-')){setLocalSchemes(localSchemes().filter(x=>x.id!==sc.id)); renderTab(); return}
  try{await db.doc('schemes/'+sc.id).delete()}catch(e){document.getElementById('scheme-toast').textContent='Only the person who saved a scheme can delete it.'}
}
async function vote(sc){ if(!db||!uid) return;
  const ref=db.doc('votes/'+uid); try{ if(votes[uid]===sc.id) await ref.delete(); else await ref.set({schemeId:sc.id,at:Date.now()}); }catch(e){document.getElementById('scheme-toast').textContent='Your vote didn’t save. You may have view-only access to this page.'} }
function renderSchemes(){
  const S=el('div',{class:'sec'});
  S.append(el('div',{class:'eyebrow'},'Save this look'));
  const name=el('input',{type:'text',class:'search',id:'scheme-name',placeholder:'Name it, e.g. Moody green',maxlength:'60','aria-label':'Scheme name'});
  const go=()=>{const v=name.value.trim()||('Scheme '+(schemes.length+localSchemes().length+1)); saveScheme(v); name.value=''};
  name.onkeydown=e=>{if(e.key==='Enter') go()};
  S.append(el('div',{class:'row'},name,el('button',{class:'btn primary',onclick:go},'Save')));
  S.append(el('div',{class:'toast',id:'scheme-toast'}));
  S.append(el('p',{class:'note'}, 'Schemes save on this device. Save two or three, then load them to compare.'));
  body.append(S);
  const L=el('div',{class:'sec'});
  const all=[...schemes,...localSchemes()];
  const tally={}; Object.values(votes).forEach(id=>tally[id]=(tally[id]||0)+1);
  const top=Math.max(0,...Object.values(tally));
  L.append(el('div',{class:'eyebrow'},all.length?`${all.length} scheme${all.length>1?'s':''} · ${Object.keys(votes).length} vote${Object.keys(votes).length===1?'':'s'}`:'Schemes'));
  if(!all.length){L.append(el('p',{class:'empty'},'No schemes yet. Style the room, then save it above. Save two or three to compare them side by side and collect votes.')); body.append(L); return}
  const cards=el('div',{class:'cards'});
  all.sort((a,b)=>(tally[b.id]||0)-(tally[a.id]||0)||b.createdAt-a.createdAt).forEach(sc=>{
    const n=tally[sc.id]||0, voters=Object.entries(votes).filter(([,v])=>v===sc.id).map(([k])=>k);
    const mine=sc.createdBy&&sc.createdBy===uid, local=sc.id.startsWith('local-');
    const faces=el('span',{class:'faces'}); voters.slice(0,5).forEach(v=>{const p=profiles[v]; if(p){const im=el('img',{src:p.avatarUrl,alt:''}); im.title=p.name||'Someone'; faces.append(im)}});
    const acts=el('div',{class:'acts'},el('button',{class:'btn',onclick:()=>loadScheme(sc)},'Load'),
      !local&&db&&uid?el('button',{class:'btn vote','aria-pressed':String(votes[uid]===sc.id),onclick:()=>vote(sc)},votes[uid]===sc.id?'Voted':'Vote'):null,
      (local||mine||isOwner)?el('button',{class:'btn',onclick:()=>delScheme(sc),'aria-label':'Delete '+sc.name},'Delete'):null, faces);
    const by=sc.createdBy&&profiles[sc.createdBy]?(profiles[sc.createdBy].isMe?'you':(profiles[sc.createdBy].name||'someone')):(local?'this device':'');
    cards.append(el('div',{class:'card'+(mine?' mine':'')},sc.thumb?el('img',{src:sc.thumb,alt:'Preview of '+sc.name}):el('div',{class:'ph'}),
      el('div',{style:'min-width:0'},n&&n===top?el('div',{class:'lead'},'Leading'):null,el('h3',{},sc.name),el('div',{class:'sub'},(local?'Only on this device':`${n} vote${n===1?'':'s'}`)+(by?' · by '+by:'')),acts)));
  });
  L.append(cards); body.append(L);
}
async function resolveProfiles(){ if(!user) return; const ids=[...new Set([...Object.keys(votes),...schemes.map(s=>s.createdBy).filter(Boolean)])]; if(!ids.length) return; profiles=await user.profiles(ids); if(ui.tab==='schemes') renderTab(); }
(async()=>{
  if(!window.claude||!window.claude.use) return;
  try{ [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]); }catch(e){db=null;user=null}
  if(user){uid=await user.id(); isOwner=await user.isOwner(); canWrite=await user.can('data.write'); if(canWrite===false) writeBlocked=true;}
  if(!db){ if(ui.tab==='schemes') renderTab(); return; }
  db.collection('schemes').orderBy('createdAt','desc').limit(60).onSnapshot(s=>{schemes=s.docs.map(d=>({id:d.id,...d.data()})); resolveProfiles(); if(ui.tab==='schemes') renderTab()},()=>{});
  db.collection('votes').onSnapshot(s=>{votes=Object.fromEntries(s.docs.map(d=>[d.id,d.data().schemeId])); resolveProfiles(); if(ui.tab==='schemes') renderTab()},()=>{});
  if(ui.tab==='schemes') renderTab();
})();

/* ================= Loop ================= */
function resize(){const r=stage.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); camera.aspect=r.width/Math.max(r.height,1); camera.updateProjectionMatrix(); placeSplit()}
const tmp=new THREE.Vector3();
function cutaway(b){for(const g of Object.values(b.walls)){tmp.copy(camera.position).sub(g.userData.center); g.visible=tmp.dot(g.userData.normal)>-.02} b.ceil.visible=camera.position.y<b.H-.05}
function drawFrame(){
  cutaway(cur);
  const w=renderer.domElement.clientWidth, h=renderer.domElement.clientHeight;
  if(ui.compare&&orig){
    cutaway(orig); const sx=Math.round(w*ui.split);
    renderer.setScissorTest(true);
    cur.root.visible=false; orig.root.visible=true; renderer.setScissor(0,0,sx,h); renderer.render(scene,camera);
    cur.root.visible=true; orig.root.visible=false; renderer.setScissor(sx,0,w-sx,h); renderer.render(scene,camera);
    renderer.setScissorTest(false);
  } else { orig&&(orig.root.visible=false); cur.root.visible=true; renderer.render(scene,camera); }
}
function frame(now){
  requestAnimationFrame(frame);
  if(tween){tween.t=Math.min(1,tween.t+.035); const k=1-Math.pow(1-tween.t,3); camera.position.lerpVectors(tween.p0,tween.p1,k); controls.target.lerpVectors(tween.t0,tween.t1,k); if(tween.t>=1) tween=null}
  controls.update();
  if(flashMats.length){const left=flashUntil-now; const a=left>0?Math.sin((1-left/900)*Math.PI)*.35:0; flashMats.forEach(m=>m.emissive.copy(accent).multiplyScalar(a)); if(left<=0) flashMats=[]}
  drawFrame();
}
rebuild(); applySceneMood(); renderTools(); renderTabs(); renderTab(); setCompare();
new ResizeObserver(resize).observe(stage); resize();
requestAnimationFrame(frame);
</script>
