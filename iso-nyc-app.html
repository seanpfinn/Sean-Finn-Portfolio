<style>
html, body { margin: 0; padding: 0; height: 100%; }

/* Layout: full-bleed WebGL diorama; one docked control strip bottom-left, a small station HUD top-left.
   Single committed night-glass look over the scene, so colors are set explicitly. */
:root{
  --glass: rgba(9, 13, 24, .70);
  --glass-hi: rgba(255, 255, 255, .06);
  --rule: rgba(214, 222, 240, .12);
  --text: #eef1f7;
  --muted: #98a2b8;
  --sodium: #ffb547;          /* high-pressure sodium streetlamp */
  --sodium-wash: rgba(255, 181, 71, .14);
  --night: #0a0e19;
  --f-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--night); color: var(--text); font-family: var(--f-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; touch-action: pan-y; cursor: default; }
#stage.pannable { cursor: grab; }
#stage.dragging { cursor: grabbing; }
#stage canvas { display: block; width: 100%; height: 100%; }

.hud {
  position: fixed; top: calc(14px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  pointer-events: none;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 10px; background: var(--glass); backdrop-filter: blur(12px) saturate(1.2); -webkit-backdrop-filter: blur(12px) saturate(1.2); border: 1px solid var(--rule); border-radius: 10px; }
.brand .disc { width: 22px; height: 22px; border-radius: 50%; background: var(--sodium); display: grid; place-items: center; color: #1a1205; font: 700 11px/1 var(--f-ui); letter-spacing: .02em; flex: none; }
.brand .name { font-weight: 600; font-size: 14px; letter-spacing: .01em; }
.brand .sub { font: 400 11px/1.3 var(--f-mono); color: var(--muted); letter-spacing: .02em; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; background: #050608; border: 1px solid #22252c; border-radius: 6px; font: 500 12px/1 var(--f-mono); color: var(--sodium); letter-spacing: .06em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--sodium); box-shadow: 0 0 8px var(--sodium); }
.chip.passing i { animation: blink .5s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }

.hint { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); font: 400 11px/1 var(--f-mono); color: var(--text); background: var(--glass); border: 1px solid var(--rule); border-radius: 999px; padding: 7px 11px; pointer-events: none; transition: opacity .6s; }

.panel {
  position: fixed;
  left: max(16px, env(safe-area-inset-left, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(580px, calc(100vw - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  background: var(--glass);
  backdrop-filter: blur(16px) saturate(1.25); -webkit-backdrop-filter: blur(16px) saturate(1.25);
  border: 1px solid var(--rule);
  border-radius: 14px;
  padding: 14px 16px 16px;
  display: grid; gap: 12px;
  box-shadow: 0 24px 60px -24px rgba(0,0,0,.7);
}
.readout { display: flex; align-items: center; gap: 14px; min-width: 0; }
.clock { display: flex; align-items: baseline; gap: 4px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; flex: none; }
.clock #clk { font-size: 32px; font-weight: 500; letter-spacing: -.02em; line-height: 1; }
.clock #ap { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.meta span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta #dateTxt { font-size: 13px; font-weight: 500; }
.meta #sunTxt { font: 400 11px/1.2 var(--f-mono); color: var(--muted); letter-spacing: .02em; }
.wxnow { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
.wxnow #tempTxt { font: 500 18px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.wxnow #condTxt { font-size: 11px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.btns { display: flex; gap: 6px; flex: none; }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--rule); background: var(--glass-hi); color: var(--text); cursor: pointer; transition: background .15s, border-color .15s; }
.icon-btn:hover { background: rgba(255,255,255,.11); }
.icon-btn:focus-visible, .seg button:focus-visible, .presets button:focus-visible, #showBtn:focus-visible { outline: 2px solid var(--sodium); outline-offset: 2px; }
.icon-btn svg { width: 16px; height: 16px; }

.scrub { position: relative; padding-bottom: 14px; }
#timeRange { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; border-radius: 7px; margin: 0; cursor: pointer; background: #223; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
#timeRange::-webkit-slider-runnable-track { height: 28px; background: transparent; }
#timeRange::-moz-range-track { height: 28px; background: transparent; }
#timeRange::-webkit-slider-thumb { -webkit-appearance: none; width: 6px; height: 38px; margin-top: -5px; border-radius: 3px; background: #fff; box-shadow: 0 0 0 2px rgba(9,13,24,.75), 0 2px 10px rgba(0,0,0,.5); }
#timeRange::-moz-range-thumb { width: 6px; height: 38px; border: 0; border-radius: 3px; background: #fff; box-shadow: 0 0 0 2px rgba(9,13,24,.75), 0 2px 10px rgba(0,0,0,.5); }
#timeRange:focus-visible { outline: 2px solid var(--sodium); outline-offset: 3px; }
.marks { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; font: 400 10px/1 var(--f-mono); color: var(--muted); }
.marks span { position: absolute; bottom: 0; transform: translateX(-50%); white-space: nowrap; }
.marks span::before { content: ""; position: absolute; left: 50%; bottom: 13px; width: 1px; height: 5px; background: rgba(255,255,255,.4); }
.marks .edge { transform: none; }
.marks .edge.r { transform: translateX(-100%); }
.marks .edge::before { display: none; }

.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets button { font: 500 11px/1 var(--f-mono); letter-spacing: .04em; color: var(--muted); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 6px 10px; cursor: pointer; transition: color .15s, border-color .15s; }
.presets button:hover { color: var(--text); border-color: rgba(255,255,255,.3); }

.seg { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 4px; border-radius: 10px; background: rgba(0,0,0,.28); border: 1px solid var(--rule); }
.seg button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 7px 2px 6px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--muted); font: 500 11px/1 var(--f-ui); letter-spacing: .02em; cursor: pointer; transition: color .15s, background .15s, border-color .15s; }
.seg button svg { width: 20px; height: 20px; }
.seg button:hover { color: var(--text); }
.seg button[aria-checked="true"] { color: var(--sodium); background: var(--sodium-wash); border-color: rgba(255,181,71,.45); }

#showBtn { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font: 500 12px/1 var(--f-ui); color: var(--text); background: var(--glass); border: 1px solid var(--rule); border-radius: 999px; padding: 10px 14px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
#showBtn i { width: 8px; height: 8px; border-radius: 50%; background: var(--sodium); }

@media (max-width: 520px) {
  .panel { padding: 12px; gap: 10px; }
  .clock #clk { font-size: 26px; }
  .readout { gap: 10px; flex-wrap: wrap; }
  .meta { order: 3; flex-basis: 100%; }
  .wxnow { margin-left: auto; }
  .seg { grid-template-columns: repeat(3, 1fr); }
  .seg button { flex-direction: row; justify-content: center; padding: 8px 4px; }
  .seg button svg { width: 16px; height: 16px; }
  .brand .sub { display: none; }
}
@media (prefers-reduced-motion: reduce) { .chip.passing i { animation: none; } }
</style>
</head>
<body>


<div id="stage" role="img" aria-label="Animated photoreal 3D view of the Manhattan skyline seen from the Brooklyn waterfront, with the Brooklyn Bridge, a street, and a subway station cut away below"></div>

    <button role="radio" aria-checked="false" data-wx="snow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14h10a4 4 0 0 0 .3-8A5.5 5.5 0 0 0 6.8 7 3.5 3.5 0 0 0 7 14z"/><circle cx="8" cy="18" r=".6" fill="currentColor"/><circle cx="12" cy="20" r=".6" fill="currentColor"/><circle cx="16" cy="18" r=".6" fill="currentColor"/></svg>Snow</button>
    <button role="radio" aria-checked="false" data-wx="fog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 9h16M6 13h12M4 17h16"/></svg>Fog</button>
    <button role="radio" aria-checked="false" data-wx="storm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14h10a4 4 0 0 0 .3-8A5.5 5.5 0 0 0 6.8 7 3.5 3.5 0 0 0 7 14z"/><path d="M12.5 15l-2 3.5h3l-2 3.5"/></svg>Storm</button>
  </div>

<button id="showBtn" hidden><i></i>Show controls</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<script>
(() => {
'use strict';
/* =====================================================================
   East River — physically based. Units are meters. A telephoto camera
   300 m back from the waterfront street looks across the river at
   Manhattan 3–5 km away, so scale and haze behave like a real photo.
   ===================================================================== */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
let seed = 20261028;
const srand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const sr = (a, b) => a + srand() * (b - a);
const pick = arr => arr[Math.floor(srand() * arr.length)];
const C = h => new THREE.Color(h).convertSRGBToLinear();
const setS = (c, r, g, b) => c.setRGB(r, g, b).convertSRGBToLinear();
const WHITE = new THREE.Color(1, 1, 1);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const D2R = Math.PI / 180;

/* ---------- renderer, camera, post ---------- */
const stage = $('#stage');
const mobile = Math.min(innerWidth, innerHeight) < 700;
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', stencil: false });
const DPR = Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 1.75);
renderer.setPixelRatio(DPR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
stage.appendChild(renderer.domElement);
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
const isWGL2 = renderer.capabilities.isWebGL2;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xffffff, 0.00012);
const D0 = 300, EYE = 4, WATER_Y = -2.5, FRAME_BOTTOM = -23.5, SCENE_W = 176;
const camera = new THREE.PerspectiveCamera(13, 1, 150, 16000);
let visH = 70, visW = 160, panX = 0, panRange = 0, lensShift = 0;

const rtOpts = { format: THREE.RGBAFormat, type: isWGL2 ? THREE.HalfFloatType : THREE.UnsignedByteType };
const rt = isWGL2 ? new THREE.WebGLMultisampleRenderTarget(4, 4, rtOpts) : new THREE.WebGLRenderTarget(4, 4, rtOpts);
if (isWGL2) rt.samples = 4;
const composer = new THREE.EffectComposer(renderer, rt);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), .45, .4, 1.0);
composer.addPass(bloom);
const finalPass = new THREE.ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uVig: { value: .28 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uVig; varying vec2 vUv;
    vec3 toSRGB(vec3 c){ c = max(c, 0.0); return mix(c * 12.92, 1.055 * pow(c, vec3(1.0/2.4)) - 0.055, step(0.0031308, c)); }
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + uTime * 7.31) * 43758.5453); }
    void main(){
      vec2 d = vUv - 0.5; d.x *= 1.3;
      vec2 ca = d * 0.0022 * smoothstep(0.1, 0.9, length(d));
      vec3 c = vec3(texture2D(tDiffuse, vUv + ca).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - ca).b);
      c *= 1.0 - uVig * smoothstep(0.25, 0.85, length(d));
      c = toSRGB(c);
      c = c * 0.985 + 0.012;
      c += (h(gl_FragCoord.xy) - 0.5) * (2.5 / 255.0);
      gl_FragColor = vec4(c, 1.0);
    }`,
});
composer.addPass(finalPass);

/* ---------- canvas texture helpers ---------- */
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function tex(c, srgb, wrap = true) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.encoding = THREE.sRGBEncoding;
  if (wrap) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = ANISO; return t;
}
function normalFromHeight(hc, strength) {
  const w = hc.width, h = hc.height, src = hc.getContext('2d').getImageData(0, 0, w, h).data;
  const [c, g] = canvas(w, h), out = g.createImageData(w, h), o = out.data;
  const H = (x, y) => src[(((y + h) % h) * w + ((x + w) % w)) * 4] / 255;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let nx = -(H(x + 1, y) - H(x - 1, y)) * strength, ny = -(H(x, y - 1) - H(x, y + 1)) * strength, nz = 1;
    const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
    const i = (y * w + x) * 4; o[i] = (nx * .5 + .5) * 255; o[i + 1] = (ny * .5 + .5) * 255; o[i + 2] = (nz * .5 + .5) * 255; o[i + 3] = 255;
  }
  g.putImageData(out, 0, 0); return c;
}
function speckle(g, S, n, dark, light, amt) {
  for (let i = 0; i < n; i++) { g.fillStyle = Math.random() < .5 ? `rgba(${dark},${Math.random() * amt})` : `rgba(${light},${Math.random() * amt})`; g.fillRect(Math.random() * S, Math.random() * S, 1 + Math.random() * 4, 1 + Math.random() * 3); }
}
const GLOW = (() => { const [c, g] = canvas(128, 128); const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.12, 'rgba(255,255,255,.5)'); r.addColorStop(.4, 'rgba(255,255,255,.08)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 128, 128); return tex(c, false, false); })();
const SOFT = (() => { const [c, g] = canvas(64, 64); const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.5, 'rgba(255,255,255,.45)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return tex(c, false, false); })();
