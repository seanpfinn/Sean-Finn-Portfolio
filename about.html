  <!-- Password gate -->
  <style>
    html.sf-locked body { visibility: hidden; }
    #sf-gate {
      visibility: visible;
      position: fixed; inset: 0; z-index: 100000;
      display: flex; align-items: center; justify-content: center;
      background: #fff;
      font-family: 'Geist', system-ui, -apple-system, sans-serif;
    }
    #sf-gate form {
      display: flex; flex-direction: column; align-items: center;
      gap: 0.75rem; width: min(25rem, 90vw);
    }
    #sf-gate h1 {
      font-size: 1.5rem; font-weight: 500; color: #09090b;
      letter-spacing: -0.01875rem; margin: 0 0 0.25rem; white-space: nowrap; text-align: center;
    }
    #sf-gate input {
      width: 100%; padding: 0.625rem 0.875rem; box-sizing: border-box;
      border: 0.0625rem solid #e4e4e7; border-radius: 0.625rem;
      font-size: 0.875rem; font-family: inherit; text-align: center;
      background: #fff; color: #09090b; outline: none;
    }
    #sf-gate input:focus { border-color: #09090b; }
    #sf-gate button {
      width: 100%; padding: 0.625rem 0.875rem; border: none; border-radius: 0.625rem;
      background: #09090b; color: #fff; font-size: 0.875rem; font-weight: 500;
      font-family: inherit; cursor: pointer;
    }
    #sf-gate .sf-err { font-size: 0.8125rem; color: #dc2626; height: 1rem; }
    #sf-gate.dark { background: #09090b; }
    #sf-gate.dark h1 { color: #fafafa; }
    #sf-gate.dark input { background: #18181b; border-color: #27272a; color: #fafafa; }
    #sf-gate.dark input:focus { border-color: #fafafa; }
    #sf-gate.dark button { background: #fafafa; color: #09090b; }
  </style>
  <script>
    (function () {
      if (localStorage.getItem('sf_unlocked') === '1') return;
      document.documentElement.classList.add('sf-locked');
      document.addEventListener('DOMContentLoaded', function () {
        var gate = document.createElement('div');
        gate.id = 'sf-gate';
        if (localStorage.getItem('dark') === '1') gate.classList.add('dark');
        gate.innerHTML =
          '<form>' +
            '<h1>Enter password to continue</h1>' +
            '<input type="password" autocomplete="current-password" aria-label="Password" />' +
            '<button type="submit">Enter</button>' +
            '<div class="sf-err"></div>' +
          '</form>';
        document.body.appendChild(gate);
        var form = gate.querySelector('form');
        var input = gate.querySelector('input');
        var err = gate.querySelector('.sf-err');
        input.focus();
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          if (input.value === 'nspf1991') {
            localStorage.setItem('sf_unlocked', '1');
            document.documentElement.classList.remove('sf-locked');
            gate.remove();
          } else {
            err.textContent = 'Incorrect password';
            input.value = '';
            input.focus();
          }
        });
      });
    })();
  </script>

  <style>
    /* ── CANVAS WRAP fills right-col ── */
    .ab-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    /* ── INNER CANVAS (draggable) ── */
    .ab-canvas {
      position: absolute;
      top: 0; left: 0;
      display: grid;
      grid-template-columns: repeat(6, 12.5rem);
      gap: 0.875rem;
      padding: 1.875rem;
      will-change: transform;
      touch-action: none;
    }

    .ab-canvas.is-dragging .iso-tile { pointer-events: none; }

    /* ── ISO TILE ── */
    .iso-tile {
      width: 12.5rem;
      height: 12.5rem;
      background: var(--bg-card-out);
      border: 0.0625rem solid var(--border);
      border-radius: 1.25rem;
      padding: 1.25rem 0.875rem 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-card);
      user-select: none;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .iso-tile:hover,
    .iso-tile.is-active {
      transform: translateY(-0.25rem);
      border-color: var(--text-dim);
    }

    .iso-svg { width: 100%; flex: 1; min-height: 0; display: block; }

    .iso-label {
      font-family: var(--mono);
      font-size: 0.625rem;
      font-weight: 400;
      letter-spacing: 0.05rem;
      text-transform: uppercase;
      color: var(--text-dim);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── POPUP ── */
    .iso-popup {
      position: fixed;
      z-index: 600;
      background: var(--bg);
      border: 0.0625rem solid var(--border);
      border-radius: 0.875rem;
      padding: 0.875rem;
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      width: 14.375rem;
      box-shadow: 0 0.5rem 2rem rgba(0,0,0,0.14);
      pointer-events: none;
      opacity: 0;
      transform: translateY(0.375rem) scale(0.97);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .iso-popup.is-visible { opacity: 1; transform: translateY(0) scale(1); }
    .iso-popup-emoji { font-size: 1.5rem; line-height: 1; flex-shrink: 0; margin-top: 0.0625rem; }
    .iso-popup-body  { display: flex; flex-direction: column; gap: 0.25rem; }
    .iso-popup-name  { font-family: var(--font); font-size: 0.8125rem; font-weight: 600; letter-spacing: -0.01875rem; color: var(--text); display: block; }
    .iso-popup-desc  { font-family: var(--font); font-size: 0.75rem; line-height: 1rem; letter-spacing: -0.00625rem; color: var(--text-body); }

    /* ── DRAG HINT ── */
    .ab-hint {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(0.375rem);
      -webkit-backdrop-filter: blur(0.375rem);
      color: #fff;
      font-family: var(--mono);
      font-size: 0.6875rem;
      letter-spacing: 0.025rem;
      padding: 0.375rem 0.875rem;
      border-radius: 1.25rem;
      pointer-events: none;
      z-index: 10;
      white-space: nowrap;
      opacity: 0;
      animation: hintFade 4s ease 0.8s forwards;
    }
    @keyframes hintFade {
      0%   { opacity: 0; transform: translateX(-50%) translateY(0.25rem); }
      15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      75%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-0.125rem); }
    }

    /* ── MOBILE ── */
    @media (max-width: 50.5625rem) {
      .ab-canvas { grid-template-columns: repeat(3, 9.375rem); gap: 0.625rem; padding: 1.25rem; }
      .iso-tile  { width: 9.375rem; height: 9.375rem; border-radius: 0.875rem; padding: 0.875rem 0.625rem 0.625rem; }

      /* Lock the viewport so the canvas doesn't scroll the page */
      html, body   { height: 100% !important; overflow: hidden !important; }
      body         { display: flex; flex-direction: column; }
      .page        { flex: 1 !important; min-height: 0 !important; height: auto !important; overflow: hidden !important; }
      .right-col   { flex: 1 !important; min-height: 0 !important; }
      .mobile-footer { display: none !important; }
    }

  <script>
  (function () {
    const ITEMS = [
      { emoji:'☕', name:'Coffee',       desc:'Strong opinions. Stronger espresso. My morning ritual since forever.',                top:'#E8C55A', left:'#B8952A', right:'#7A6010' },
      { emoji:'🎵', name:'Vinyl',        desc:'Currently spinning whatever makes the apartment feel bigger.',                         top:'#525252', left:'#333333', right:'#222222' },
      { emoji:'📷', name:'Camera',       desc:'Shooting on a Leica M6. Documenting Brooklyn one roll at a time.',                    top:'#6B7280', left:'#374151', right:'#1F2937' },
      { emoji:'✏️', name:'Figma',        desc:"My main creative environment. I've probably spent more time here than anywhere else.", top:'#C4B5FD', left:'#7C3AED', right:'#4C1D95' },
      { emoji:'🌿', name:'Plants',       desc:'My apartment is slowly becoming a jungle. Zero regrets.',                              top:'#6EE7B7', left:'#059669', right:'#064E3B' },
      { emoji:'👟', name:'Sneakers',     desc:'Air Maxes, New Balances, and an embarrassing number of Salomons.',                    top:'#E5E7EB', left:'#9CA3AF', right:'#4B5563' },
      { emoji:'🚲', name:'Cycling',      desc:'My main mode of transportation through Brooklyn. Helmet always.',                     top:'#FCD34D', left:'#D97706', right:'#92400E' },
      { emoji:'🎧', name:'Headphones',   desc:'Sony WH-1000XM5. The only way to survive open-plan offices.',                        top:'#71717A', left:'#3F3F46', right:'#27272A' },
      { emoji:'📚', name:'Books',        desc:'Design, philosophy, fiction. Currently: Thinking in Systems.',                        top:'#7DD3FC', left:'#0369A1', right:'#0C4A6E' },
      { emoji:'🎬', name:'Film',         desc:'Scorsese, Villeneuve, Nolan. Watching everything. Missing nothing.',                  top:'#94A3B8', left:'#475569', right:'#1E293B' },
      { emoji:'⌨️', name:'Keyboards',   desc:'HHKB Professional Hybrid. Quiet switches. Loud opinions.',                            top:'#9CA3AF', left:'#4B5563', right:'#1F2937' },
      { emoji:'🍕', name:'Pizza',        desc:'New York pizza is the only pizza. This is not up for debate.',                        top:'#FCA5A5', left:'#DC2626', right:'#7F1D1D' },
      { emoji:'🐕', name:'Dogs',         desc:'Dog dad in my heart. Currently coveting a Vizsla.',                                   top:'#FDE68A', left:'#D97706', right:'#78350F' },
      { emoji:'🏛️', name:'Architecture', desc:"Obsessed with NYC's layers — pre-war walkups, brutalist towers, glass boxes.",        top:'#D1D5DB', left:'#6B7280', right:'#374151' },
      { emoji:'🏃', name:'Running',      desc:'5am runs along the waterfront before the city wakes up.',                             top:'#FED7AA', left:'#EA580C', right:'#7C2D12' },
      { emoji:'🥃', name:'Whiskey',      desc:'Neat, please. Preferably something peaty from Islay.',                                top:'#FCD34D', left:'#B45309', right:'#451A03' },
      { emoji:'💻', name:'MacBook',      desc:'The machine that ships it all. Running way too many browser tabs.',                    top:'#E5E7EB', left:'#9CA3AF', right:'#374151' },
      { emoji:'🌆', name:'New York',     desc:'Eight years in. Still discovering new blocks. Probably never leaving.',               top:'#BAE6FD', left:'#0284C7', right:'#075985' },
      { emoji:'🎨', name:'Art',          desc:'MoMA, the Whitney, and every gallery opening in Bushwick I can find.',                top:'#FDE68A', left:'#F59E0B', right:'#78350F' },
      { emoji:'🍳', name:'Cooking',      desc:'Sunday mornings, big breakfasts, too much butter. Worth it every time.',              top:'#FCA5A5', left:'#EF4444', right:'#7F1D1D' },
      { emoji:'✈️', name:'Travel',       desc:'Slow travel. Long layovers. Getting lost on purpose.',                                top:'#BAE6FD', left:'#38BDF8', right:'#0369A1' },
      { emoji:'🏀', name:'Basketball',   desc:'Watching the Nets suffer. Hoping annually. Somehow still a fan.',                     top:'#FED7AA', left:'#F97316', right:'#7C2D12' },
      { emoji:'🏄', name:'Surfing',      desc:'Weekend trips to Rockaway. Never getting good. Always going back.',                   top:'#6EE7F7', left:'#0891B2', right:'#164E63' },
      { emoji:'🍺', name:'Craft Beer',   desc:'Sours, IPAs, and anything from Other Half. Brooklyn biased.',                         top:'#FDE68A', left:'#D97706', right:'#78350F' },
    ];

    function cubeSVG(top, left, right, emoji) {
      return `<svg class="iso-svg" viewBox="0 0 120 106" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <polygon points="60,8 100,30 60,52 20,30" fill="${top}"/>
        <polygon points="20,30 60,52 60,98 20,76" fill="${left}"/>
        <polygon points="60,52 100,30 100,76 60,98" fill="${right}"/>
        <text x="60" y="36" text-anchor="middle" dominant-baseline="middle" font-size="26" style="user-select:none;pointer-events:none">${emoji}</text>
      </svg>`;
    }

    function tileHTML(item) {
      return `<div class="iso-tile"
        data-emoji="${item.emoji}"
        data-name="${item.name}"
        data-desc="${item.desc.replace(/"/g,'&quot;')}"
        tabindex="0" role="button" aria-label="${item.name}">
        ${cubeSVG(item.top, item.left, item.right, item.emoji)}
        <span class="iso-label">${item.name}</span>
      </div>`;
    }

    const canvas = document.getElementById('ab-canvas');
    const wrap   = document.getElementById('ab-wrap');
    canvas.innerHTML = ITEMS.map(tileHTML).join('');

    // ── Drag / pan ──────────────────────────────────────────────────────────
    let tx = 30, ty = 30;
    let isDragging = false, hasDragged = false;
    let startX, startY, startTx, startTy;
    let velX = 0, velY = 0, lastMX, lastMY;
    let rafId;

    function getBounds() {
      const cw = canvas.offsetWidth,  ch = canvas.offsetHeight;
      const ww = wrap.offsetWidth,    wh = wrap.offsetHeight;
      const pad = 60;
      return {
        minX: cw > ww ? ww - cw - pad : (ww - cw) / 2,
        maxX: cw > ww ? pad            : (ww - cw) / 2,
        minY: ch > wh ? wh - ch - pad  : (wh - ch) / 2,
        maxY: ch > wh ? pad            : (wh - ch) / 2,
      };
    }

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function applyTransform(x, y) {
      const b = getBounds();
      tx = clamp(x, b.minX, b.maxX);
      ty = clamp(y, b.minY, b.maxY);
      canvas.style.transform = `translate3d(${tx}px,${ty}px,0)`;
    }

    function runInertia() {
      velX *= 0.91; velY *= 0.91;
      if (Math.abs(velX) < 0.3 && Math.abs(velY) < 0.3) return;
      applyTransform(tx + velX, ty + velY);
      rafId = requestAnimationFrame(runInertia);
    }

    requestAnimationFrame(() => applyTransform(30, 30));

    // Mouse
    wrap.addEventListener('mousedown', e => {
      cancelAnimationFrame(rafId);
      isDragging = true; hasDragged = false;
      startX = e.clientX; startY = e.clientY;
      startTx = tx; startTy = ty;
      lastMX = e.clientX; lastMY = e.clientY;
      velX = 0; velY = 0;
      canvas.classList.add('is-dragging');
      hidePopup();
      e.preventDefault();
    });

    document.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) hasDragged = true;
      velX = e.clientX - lastMX; velY = e.clientY - lastMY;
      lastMX = e.clientX; lastMY = e.clientY;
      applyTransform(startTx + dx, startTy + dy);
    });

    document.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;
      setTimeout(() => canvas.classList.remove('is-dragging'), 30);
      if (Math.abs(velX) > 0.5 || Math.abs(velY) > 0.5) rafId = requestAnimationFrame(runInertia);
    });

    // Touch
    wrap.addEventListener('touchstart', e => {
      cancelAnimationFrame(rafId);
      if (e.touches.length !== 1) return;
      isDragging = true; hasDragged = false;
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      startTx = tx; startTy = ty;
      lastMX = startX; lastMY = startY;
      velX = 0; velY = 0;
    }, { passive: true });

    wrap.addEventListener('touchmove', e => {
      if (!isDragging || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - startX, dy = e.touches[0].clientY - startY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) hasDragged = true;
      velX = e.touches[0].clientX - lastMX; velY = e.touches[0].clientY - lastMY;
      lastMX = e.touches[0].clientX; lastMY = e.touches[0].clientY;
      applyTransform(startTx + dx, startTy + dy);
      e.preventDefault();
    }, { passive: false });

    wrap.addEventListener('touchend', e => {
      if (!isDragging) return;
      isDragging = false;
      if (!hasDragged) {
        const t = e.changedTouches[0];
        const el = document.elementFromPoint(t.clientX, t.clientY);
        const tile = el && el.closest('.iso-tile');
        if (tile) handleTap(tile);
      } else if (Math.abs(velX) > 0.5 || Math.abs(velY) > 0.5) {
        rafId = requestAnimationFrame(runInertia);
      }
    });

    // ── Popup ───────────────────────────────────────────────────────────────
    const popup      = document.getElementById('iso-popup');
    const popupEmoji = document.getElementById('iso-popup-emoji');
    const popupName  = document.getElementById('iso-popup-name');
    const popupDesc  = document.getElementById('iso-popup-desc');
    let activeTile   = null;

    function showPopup(tile) {
      popupEmoji.textContent = tile.dataset.emoji;
      popupName.textContent  = tile.dataset.name;
      popupDesc.textContent  = tile.dataset.desc;
      popup.setAttribute('aria-hidden', 'false');
      const r = tile.getBoundingClientRect();
      const pw = 230, ph = 96;
      let left = r.left + r.width / 2 - pw / 2;
      let top  = r.top - ph - 12;
      const pad = 8;
      left = Math.max(pad, Math.min(left, window.innerWidth - pw - pad));
      if (top < pad) top = r.bottom + 12;
      popup.style.left = left + 'px';
      popup.style.top  = top  + 'px';
      popup.classList.add('is-visible');
    }

    function hidePopup() {
      popup.classList.remove('is-visible');
      popup.setAttribute('aria-hidden', 'true');
      if (activeTile) { activeTile.classList.remove('is-active'); activeTile = null; }
    }

    function handleTap(tile) {
      if (activeTile === tile) { hidePopup(); return; }
      if (activeTile) activeTile.classList.remove('is-active');
      activeTile = tile;
      tile.classList.add('is-active');
      showPopup(tile);
    }

    canvas.addEventListener('mouseover', e => {
      if (isDragging) return;
      const tile = e.target.closest('.iso-tile');
      if (!tile) return;
      showPopup(tile);
    });

    canvas.addEventListener('mouseout', e => {
      const tile = e.target.closest('.iso-tile');
      if (!tile) return;
      if (!tile.contains(e.relatedTarget)) hidePopup();
    });

    canvas.addEventListener('focusin',  e => { const t = e.target.closest('.iso-tile'); if (t) showPopup(t); });
    canvas.addEventListener('focusout', e => { const t = e.target.closest('.iso-tile'); if (t && !t.contains(e.relatedTarget)) hidePopup(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') hidePopup(); });
    document.addEventListener('click',   e => { if (!e.target.closest('.iso-tile') && !e.target.closest('.iso-popup')) hidePopup(); });
  })();
  </script>

</body>
</html>
