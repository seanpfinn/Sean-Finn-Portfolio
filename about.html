  <style>
    html, body { height: 100%; }
    body.canvas-page { overflow: hidden; }

    /* Full-bleed canvas sitting under the fixed nav/footer (both z-index 10). */
    .ab-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
      background: var(--bg);
    }
    .ab-wrap.is-dragging { cursor: grabbing; }
    .ab-wrap.is-dragging .iso-obj { pointer-events: none; }

    /* The field holds a block of identical cells. Panning wraps its transform
       modulo one cell, so the same few cells cover the viewport forever. */
    .ab-field { position: absolute; top: 0; left: 0; will-change: transform; }
    .ab-cell  { position: absolute; top: 0; left: 0; }

    /* Objects sit directly on the canvas — no card, no border, no plate. */
    .iso-obj {
      position: absolute;
      appearance: none;
      background: none;
      border: 0;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4375rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .iso-obj:hover,
    .iso-obj.is-active { transform: translateY(-0.375rem); }
    .iso-obj:focus-visible { outline: 2px solid #FF401A; outline-offset: 6px; border-radius: 0.5rem; }

    .iso-svg { display: block; width: 6.75rem; height: auto; }
    /* Photo objects match the cubes' footprint; without this an image would
       render at its natural pixel size. */
    .iso-photo {
      display: block;
      width: 7.5rem;
      height: auto;
      border-radius: 0.5rem;
      pointer-events: none;
      user-select: none;
    }
    .iso-label {
      font-family: var(--mono);
      font-size: 0.625rem;
      letter-spacing: 0.05rem;
      text-transform: uppercase;
      color: var(--text-dim);
      white-space: nowrap;
    }
    /* The symbol definitions themselves never render. */
    .iso-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

    /* ── Zoom ──────────────────────────────────────────────────────────
       Clicking an object flies it to the middle while the canvas whooshes
       away behind it. The flying element is a clone positioned over the
       original, moved with a transform so it stays on the compositor. */
    .iso-zoom { position: fixed; inset: 0; z-index: 500; }
    .iso-zoom[hidden] { display: none; }
    .iso-zoom::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--bg);
      opacity: 0;
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .iso-zoom.is-open::before { opacity: 1; }

    .iso-zoom-art {
      position: fixed;
      transform-origin: center center;
      transition: transform 0.62s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      z-index: 1;
    }
    img.iso-zoom-art { border-radius: 0.75rem; object-fit: contain; }

    .iso-zoom-detail {
      position: absolute;
      left: 50%;
      bottom: 12vh;
      transform: translate(-50%, 0.75rem);
      width: min(28rem, calc(100vw - 2.5rem));
      text-align: center;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.4s ease 0.28s, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.28s;
    }
    .iso-zoom.is-open .iso-zoom-detail { opacity: 1; transform: translate(-50%, 0); }

    .iso-zoom-eyebrow { font-size: 1.5rem; line-height: 1; margin: 0 0 0.5rem; }
    .iso-zoom-name {
      font-family: var(--font);
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.0275rem;
      color: var(--text);
      margin: 0;
    }
    .iso-zoom-desc {
      font-family: var(--font);
      font-size: 0.875rem;
      line-height: 1.375rem;
      color: var(--text-body);
      margin: 0.5rem 0 0;
    }
    .iso-zoom-close {
      margin-top: 1.25rem;
      padding: 0.4375rem 1rem;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .iso-zoom-close:hover { background: var(--badge-bg); }

    /* The whoosh: the whole canvas pushes past the viewer and blurs out. */
    .ab-wrap {
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.62s cubic-bezier(0.22, 1, 0.36, 1),
                  filter 0.45s ease;
    }
    .ab-wrap.is-zoomed {
      opacity: 0;
      transform: scale(1.14);
      filter: blur(8px);
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .iso-zoom-art, .iso-zoom-detail, .ab-wrap, .iso-zoom::before { transition: none; }
      .ab-wrap.is-zoomed { transform: none; filter: none; }
    }

    .ab-hint {
      position: fixed;
      left: 50%;
      bottom: 5.5rem;
      transform: translateX(-50%);
      z-index: 5;
      font-family: var(--mono);
      font-size: 0.6875rem;
      color: var(--text-dim);
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .ab-hint.is-gone { opacity: 0; }

    @media (max-width: 50.5625rem) {
      .iso-svg { width: 5rem; }
      .iso-photo { width: 5.75rem; }
      .ab-hint { bottom: 7.5rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .iso-obj { transition: none; }
    }
  </style>

      { emoji:'🍺', name:'Craft Beer',   desc:'Sours, IPAs, and anything from Other Half. Brooklyn biased.',                         top:'#FDE68A', left:'#D97706', right:'#78350F' },
      { emoji:'🎮', name:'Switch 2',     desc:'Handheld gaming, mostly on the subway. The one console that actually leaves the apartment.', img:'assets/canvas-switch-2.jpg', top:'#FF6A57', left:'#E03A24', right:'#A5240F' },
    ];

    // ── Geometry ────────────────────────────────────────────────────────────
    // One cell holds every object once. The field renders enough cells to
    // cover the viewport plus a margin, and panning wraps modulo the cell —
    // so the canvas repeats forever with no seam and no edge to hit.
    const CELL_W = 1800;
    const CELL_H = 1400;
    const MIN_DIST = 230;   // keeps scattered objects from colliding

    const wrap  = document.getElementById('ab-wrap');
    const field = document.getElementById('ab-field');
    const defs  = document.querySelector('#iso-sprite defs');
    const hint  = document.getElementById('ab-hint');
    if (!wrap || !field || !defs) return;

    // Deterministic PRNG, so the scatter is identical on every load and
    // between cells — that is what makes the repeat seamless.
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // Scatter with rejection sampling. Positions wrap toroidally, so distance
    // is measured across the cell edges too — objects never crowd at a seam.
    function scatter(n, seed) {
      const rnd = mulberry32(seed);
      const pts = [];
      for (let i = 0; i < n; i++) {
        let best = null, bestD = -1;
        for (let a = 0; a < 400; a++) {
          const p = { x: rnd() * CELL_W, y: rnd() * CELL_H };
          let d = Infinity;
          for (const q of pts) {
            let dx = Math.abs(p.x - q.x), dy = Math.abs(p.y - q.y);
            dx = Math.min(dx, CELL_W - dx);
            dy = Math.min(dy, CELL_H - dy);
            d = Math.min(d, Math.hypot(dx, dy));
          }
          if (d > bestD) { bestD = d; best = p; }
          if (d >= MIN_DIST) break;
        }
        pts.push(best);
      }
      return pts;
    }

    // ── Assets: one <symbol> per object, instanced with <use> ───────────────
    // Previously every tile carried its own copy of the cube markup. As a
    // symbol, 24 definitions serve every cell no matter how many are on screen.
    ITEMS.forEach((it, i) => {
      const sym = document.createElementNS('http://www.w3.org/2000/svg', 'symbol');
      sym.setAttribute('id', 'iso-cube-' + i);
      sym.setAttribute('viewBox', '0 0 120 106');
      sym.innerHTML =
        '<polygon points="60,8 100,30 60,52 20,30" fill="' + it.top + '"/>' +
        '<polygon points="20,30 60,52 60,98 20,76" fill="' + it.left + '"/>' +
        '<polygon points="60,52 100,30 100,76 60,98" fill="' + it.right + '"/>' +
        '<text x="60" y="36" text-anchor="middle" dominant-baseline="middle" ' +
        'font-size="26" style="user-select:none;pointer-events:none">' + it.emoji + '</text>';
      defs.appendChild(sym);
    });

    const POS = scatter(ITEMS.length, 20260905);

    function cellHTML(primary) {
      let html = '';
      for (let i = 0; i < ITEMS.length; i++) {
        const it = ITEMS[i], p = POS[i];
        html +=
          '<button class="iso-obj" type="button"' +
          ' style="left:' + Math.round(p.x) + 'px;top:' + Math.round(p.y) + 'px"' +
          ' data-i="' + i + '"' +
          (primary ? ' aria-label="' + it.name + '"' : ' tabindex="-1" aria-hidden="true"') +
          '>' +
          // An item with `img` renders as a photo. If that file is missing the
          // onerror swaps in the cube, so the canvas never shows a broken image.
          (it.img
            ? '<img class="iso-photo" src="' + it.img + '" alt="" decoding="async"' +
              ' onerror="this.outerHTML=\'<svg class=\\\'iso-svg\\\' viewBox=\\\'0 0 120 106\\\'>' +
              '<use href=\\\'#iso-cube-' + i + '\\\'/></svg>\'" />'
            : '<svg class="iso-svg" viewBox="0 0 120 106" aria-hidden="true">' +
              '<use href="#iso-cube-' + i + '"/></svg>') +
          '<span class="iso-label">' + it.name + '</span>' +
          '</button>';
      }
      return html;
    }

    let cols = 0, rows = 0;

    function buildField() {
      const need_c = Math.ceil(wrap.offsetWidth / CELL_W) + 2;
      const need_r = Math.ceil(wrap.offsetHeight / CELL_H) + 2;
      if (need_c === cols && need_r === rows) return;
      cols = need_c; rows = need_r;
      let html = '';
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          // Only one cell is exposed to assistive tech; the rest are visual
          // repeats of the same 24 objects.
          const primary = (r === 0 && c === 0);
          html += '<div class="ab-cell"' + (primary ? '' : ' aria-hidden="true"') +
                  ' style="transform:translate3d(' + (c * CELL_W) + 'px,' + (r * CELL_H) + 'px,0)">' +
                  cellHTML(primary) + '</div>';
        }
      }
      field.innerHTML = html;
    }

    // ── Pan ─────────────────────────────────────────────────────────────────
    let tx = -CELL_W * 0.35, ty = -CELL_H * 0.3;
    let dragging = false, moved = 0;
    let lastX = 0, lastY = 0, velX = 0, velY = 0, raf = 0;

    function apply() {
      // Wrap into [-CELL, 0) so the field always covers the viewport.
      const ox = (((tx % CELL_W) + CELL_W) % CELL_W) - CELL_W;
      const oy = (((ty % CELL_H) + CELL_H) % CELL_H) - CELL_H;
      field.style.transform = 'translate3d(' + ox + 'px,' + oy + 'px,0)';
    }

    function inertia() {
      velX *= 0.94; velY *= 0.94;
      tx += velX; ty += velY;
      apply();
      if (Math.abs(velX) > 0.1 || Math.abs(velY) > 0.1) raf = requestAnimationFrame(inertia);
    }

    let pressTarget = null;

    wrap.addEventListener('pointerdown', (e) => {
      dragging = true; moved = 0;
      pressTarget = e.target.closest('.iso-obj');
      lastX = e.clientX; lastY = e.clientY;
      velX = velY = 0;
      cancelAnimationFrame(raf);
      wrap.classList.add('is-dragging');
      wrap.setPointerCapture(e.pointerId);
      closeZoom();
      if (hint) hint.classList.add('is-gone');
    });

    wrap.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      moved += Math.abs(dx) + Math.abs(dy);
      tx += dx; ty += dy;
      velX = dx; velY = dy;
      apply();
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      wrap.classList.remove('is-dragging');
      raf = requestAnimationFrame(inertia);
      // A press that barely travelled is a tap, not a drag.
      if (pressTarget && moved <= 6) openZoom(pressTarget);
      pressTarget = null;
    }
    wrap.addEventListener('pointerup', endDrag);
    wrap.addEventListener('pointercancel', endDrag);

    // ── Zoom ────────────────────────────────────────────────────────────────
    // Clicking an object flies a clone of it to the centre while the canvas
    // whooshes away behind it, then the detail panel fades in underneath.
    // The clone is moved with a transform rather than left/top so the whole
    // flight stays on the compositor.
    const zoom     = document.getElementById('iso-zoom');
    const stage    = document.getElementById('iso-zoom-stage');
    const zEyebrow = document.getElementById('iso-zoom-eyebrow');
    const zName    = document.getElementById('iso-zoom-name');
    const zDesc    = document.getElementById('iso-zoom-desc');
    const zClose   = document.getElementById('iso-zoom-close');
    let zoomOpen = false, lastFocus = null;

    function closeZoom() {
      if (!zoomOpen) return;
      zoomOpen = false;
      const art = stage.firstElementChild;
      if (art) art.style.transform = '';        // flies back to where it started
      zoom.classList.remove('is-open');
      wrap.classList.remove('is-zoomed');
      setTimeout(() => {
        if (!zoomOpen) { zoom.hidden = true; stage.innerHTML = ''; }
      }, 640);
      if (lastFocus) { lastFocus.focus(); lastFocus = null; }
    }

    function openZoom(btn) {
      const it = ITEMS[Number(btn.dataset.i)];
      const src = btn.querySelector('.iso-photo, .iso-svg');
      if (!it || !src || !zoom || zoomOpen) return;

      // Start the clone exactly over the original, then transform from there.
      const r = src.getBoundingClientRect();
      const art = src.cloneNode(true);
      art.removeAttribute('style');
      art.classList.add('iso-zoom-art');
      art.style.left = r.left + 'px';
      art.style.top = r.top + 'px';
      art.style.width = r.width + 'px';
      art.style.height = r.height + 'px';
      stage.innerHTML = '';
      stage.appendChild(art);

      zEyebrow.textContent = it.emoji;
      zName.textContent = it.name;
      zDesc.textContent = it.desc;

      zoom.hidden = false;
      zoomOpen = true;
      lastFocus = btn;

      const targetW = Math.min(window.innerWidth * 0.72, 544);
      const scale = targetW / r.width;
      const dx = window.innerWidth / 2 - (r.left + r.width / 2);
      const dy = window.innerHeight * 0.36 - (r.top + r.height / 2);

      requestAnimationFrame(() => {
        wrap.classList.add('is-zoomed');
        zoom.classList.add('is-open');
        art.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + scale + ')';
      });
      if (zClose) zClose.focus();
    }

    field.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const btn = e.target.closest('.iso-obj');
      if (!btn) return;
      e.preventDefault();
      openZoom(btn);
    });
    if (zClose) zClose.addEventListener('click', closeZoom);
    if (zoom) zoom.addEventListener('click', (e) => { if (e.target === zoom) closeZoom(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeZoom(); });

    // ── Boot ────────────────────────────────────────────────────────────────
    buildField();
    apply();
    let rt = 0;
    window.addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(() => { buildField(); apply(); }, 150);
    });
  })();
  </script>
</body>
</html>
